---
services:
  web:
    image: nginx:latest
    deploy:
      replicas: 1
      x-pre-deploy-host-command: |
        echo "{{.ServiceName}}" > /tmp/bats-deploy-template-service
        echo "{{.ProjectName}}" > /tmp/bats-deploy-template-project
      update_config:
        order: start-first
        delay: 0s
        monitor: 5s
