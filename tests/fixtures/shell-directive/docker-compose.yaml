---
volumes:
  shell-test:

services:
  web:
    build: .
    volumes:
      - shell-test:/tmp/bats-output
    deploy:
      replicas: 1
      update_config:
        order: start-first
        delay: 0s
        monitor: 5s
        x-pre-stop-command: |
          [[ -n "$$BASH_VERSION" ]] && echo -n "bash-ok" > /tmp/bats-output/result
        x-pre-stop-host-command: |
          touch /tmp/bats-shell-directive-host-completed
