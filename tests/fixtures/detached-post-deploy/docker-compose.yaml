---
services:
  web:
    image: nginx:latest
    deploy:
      replicas: 1
      x-post-deploy-host-command: |
        touch /tmp/bats-detached-post-deploy-started
        sleep 30
        touch /tmp/bats-detached-post-deploy-completed
      x-post-deploy-host-command-detached: true
      update_config:
        order: start-first
        delay: 0s
        monitor: 5s
