---
services:
  web:
    image: nginx:latest
    deploy:
      replicas: 1
      update_config:
        order: start-first
        delay: 0s
        monitor: 5s
        x-post-stop-host-command: |
          touch /tmp/orch-detached-post-stop-started
          sleep 15
          touch /tmp/orch-detached-post-stop-completed
        x-post-stop-host-command-detached: true
