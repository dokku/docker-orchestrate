---
services:
  web:
    image: nginx:latest
    deploy:
      replicas: 1
      x-pre-deploy-host-command: |
        date +%s%N > /tmp/orch-deploy-both-pre-time
      x-post-deploy-host-command: |
        date +%s%N > /tmp/orch-deploy-both-post-time
      update_config:
        order: start-first
        delay: 0s
        monitor: 5s
