---
services:
  web:
    image: nginx:latest
    deploy:
      replicas: 1
      x-pre-deploy-host-command: |
        touch /tmp/bats-detached-pre-deploy-started
        sleep 30
        touch /tmp/bats-detached-pre-deploy-completed
      x-pre-deploy-host-command-detached: true
      update_config:
        order: start-first
        delay: 0s
        monitor: 5s
