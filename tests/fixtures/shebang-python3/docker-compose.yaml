---
services:
  web:
    image: nginx:latest
    deploy:
      replicas: 1
      update_config:
        order: start-first
        delay: 0s
        monitor: 5s
        x-pre-stop-host-command: |
          #!/usr/bin/env python3
          import pathlib
          pathlib.Path("/tmp/orch-shebang-python3-completed").touch()
